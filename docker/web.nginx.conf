server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  include /etc/nginx/security-headers.conf;

  # L'API et l'admin passent par le backend ; le reste est statique.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location /admin/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Un bloc location remplace les add_header du niveau supérieur : on réinclut donc les en-têtes de sécurité.
  # Sans ceci, le manifeste part en application/octet-stream et le service worker peut rester en cache.
  location = /sw.js {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }
  error_page 404 /404.html;
}
