# Démo : nginx sert le site statique. Les en-têtes de sécurité viennent de _headers (demo-headers.conf, généré au build).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404.html;

  include /etc/nginx/demo-headers.conf;

  # add_header d'un bloc location remplace ceux du niveau supérieur : on réinclut donc les en-têtes de sécurité
  location = /sw.js {
    include /etc/nginx/demo-headers.conf;
    add_header Cache-Control "no-cache";
  }

  location ~* \.(woff2|avif|webp|png|svg)$ {
    include /etc/nginx/demo-headers.conf;
    add_header Cache-Control "public, max-age=604800";
  }

  location ~* \.(css|js|json|webmanifest)$ {
    # mime.types ne connaît pas .webmanifest : seul ce type reçoit la valeur par défaut
    default_type application/manifest+json;
    include /etc/nginx/demo-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
